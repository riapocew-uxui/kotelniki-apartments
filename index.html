<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4b1219"><title>Kotelniki Apartments</title><link rel="stylesheet" href="style.css?v=7"></head><body>
<main id="page"><section id="welcome" aria-label="Kotelniki Apartments">

</div><div id="decor" aria-hidden="true"></div>

</section><section id="success" hidden aria-labelledby="success-title" tabindex="-1"><div id="success-decor" aria-hidden="true"></div><h1 id="success-title">Оплата прошла успешно!</h1><p>Всегда будем рады Вас видеть</p><div id="gallery" aria-label="Фотогалерея"></div></section></main>
